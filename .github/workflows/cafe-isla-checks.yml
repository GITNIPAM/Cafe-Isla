name: Café Isla checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Laravel tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      CAFE_ISLA_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check frontend JavaScript
        run: |
          node --check public/assets/js/isla.js
          node --check public/assets/js/checkout.js
      - name: Reject unresolved merge conflicts
        run: |
          set +e
          git grep -n -E '^(<{7} |={7}$|>{7} |\|{7} )' -- app bootstrap config database public resources routes tests
          result=$?
          test "$result" -eq 1
      - name: Run feature and unit tests
        run: php artisan test
