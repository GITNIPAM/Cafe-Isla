    </text>

    <!-- Coastal Café Centerpiece: Sun + Swaying Palm + Steaming Cup + Waves -->
    <g clip-path="url(#isla_seal_WKVSmq_clip)" stroke-linecap="round" stroke-linejoin="round">
        <!-- Warm Terracotta Coastal Sun -->
        <circle cx="53" cy="52" r="14.5" fill="#D96245"/>

        <!-- Swaying Coastal Palm Tree (Left-Center) -->
        <path d="M 41,73 C 42,61 46,51 53,42" stroke="#F6F1E6" stroke-width="2.6"/>
        <!-- Sweeping Palm Fronds -->
        <path d="M 53,42 C 46,35 37,35 31,40" stroke="#F6F1E6" stroke-width="2.1"/>
        <path d="M 53,42 C 49,33 43,29 37,30" stroke="#F6F1E6" stroke-width="2.1"/>
        <path d="M 53,42 C 56,33 63,31 70,35" stroke="#F6F1E6" stroke-width="2.1"/>
        <path d="M 53,42 C 61,39 68,42 72,48" stroke="#F6F1E6" stroke-width="2.1"/>
        <path d="M 53,42 C 47,43 41,47 38,52" stroke="#F6F1E6" stroke-width="2"/>

        <!-- Steaming Café Cup (Right-Center Shoreline) -->
        <path d="M 60,58 L 76,58 L 74.5,69 C 74,71.5 72,73 69.5,73 L 66.5,73 C 64,73 62,71.5 61.5,69 Z" fill="#F6F1E6"/>
        <path d="M 76,60.5 C 79.5,60.5 79.5,67 75.5,67" stroke="#F6F1E6" stroke-width="2"/>
        <!-- Gentle Steam Wisps -->
        <path d="M 65,54 C 64,51.5 66.5,49.5 65.5,47" stroke="#F6F1E6" stroke-width="1.6"/>
        <path d="M 70.5,54 C 69.5,51 72,48.5 71,45.5" stroke="#F6F1E6" stroke-width="1.6"/>

        <!-- Calm Coastal Ocean Waves -->
        <path d="M 24,76 C 36,72 48,79 60,76 C 72,73 84,79 96,75" stroke="#7FB8A4" stroke-width="2.3"/>
        <path d="M 28,83 C 40,80 50,86 60,83 C 70,80 80,86 92,83" stroke="#D96245" stroke-width="2.1"/>
    </g>
</svg>
