        <textPath href="#isla_seal_WKVSmq_top" startOffset="50%" text-anchor="middle">CAFÉ ISLA</textPath>
    </text>
    <text fill="#1C3127" fill-opacity="0.9" font-family="Archivo, sans-serif" font-size="7.2" font-weight="700" letter-spacing="2.2">
