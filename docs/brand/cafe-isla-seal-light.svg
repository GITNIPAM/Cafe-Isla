<svg
    width="512"
    height="512"
    viewBox="0 0 120 120"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class=""
    aria-hidden="true"
>
    <defs>
        <path id="isla_seal_WKVSmq_top" d="M 18.5,60 A 41.5,41.5 0 1,1 101.5,60"/>
        <path id="isla_seal_WKVSmq_bot" d="M 14,60 A 46,46 0 1,0 106,60"/>
        <clipPath id="isla_seal_WKVSmq_clip">
            <circle cx="60" cy="60" r="34.5"/>
        </clipPath>
    </defs>

    <!-- Outer Stamp Bezel -->
    <circle cx="60" cy="60" r="56.5" fill="#F6F1E6" stroke="#1C3127" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="35.5" fill="#1C3127" stroke="#1C3127" stroke-width="2"/>

    <!-- Coastal Four-Point Separator Stars -->
    <polygon points="16.5,57 17.8,59.2 20,60 17.8,60.8 16.5,63 15.2,60.8 13,60 15.2,59.2" fill="#D96245"/>
    <polygon points="103.5,57 104.8,59.2 107,60 104.8,60.8 103.5,63 102.2,60.8 100,60 102.2,59.2" fill="#D96245"/>

